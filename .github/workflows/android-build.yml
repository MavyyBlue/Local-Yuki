name: Local Yuki Android build and unit tests

on:
  push:
    branches: [main, 'phase-1a-*']
    paths-ignore:
      - 'local-yuki-source.zip'
  workflow_run:
    workflows: ['Local Yuki mobile source import']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out expanded main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
          persist-credentials: false
      - name: Record exact tested commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Android build candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test -f settings.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform and build tools using runner SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test, and verify foundation boundary
        run: ./gradlew --no-daemon :foundation-contracts:check :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: local-yuki-debug-${{ steps.source.outputs.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
